server:
  port: 8088

spring:
  datasource:
    url: jdbc:mysql://db-mysql:3306/onlyfields_reportes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: true
    path: /api/v1/reportes/v3/api-docs
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html