services:
  db-mysql-reservas:
    image: mysql:8.0
    container_name: onlyfields-db-reservas
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: onlyfields_reservas
    ports:
      - "3308:3306" # Usamos 3308 para no chocar con el 3307 de Usuarios
    volumes:
      - mysql-reservas-data:/var/lib/mysql
    networks:
      - reservas-network
    restart: unless-stopped

  ms-reservas:
    build:
      context: .. # Importante: Sube un nivel para poder leer el pom.xml padre
      dockerfile: reservas/Dockerfile
    container_name: onlyfields-ms-reservas
    ports:
      - "8082:8080"
    depends_on:
      - db-mysql-reservas
    networks:
      - reservas-network
    restart: unless-stopped

networks:
  reservas-network:
    driver: bridge

volumes:
  mysql-reservas-data: