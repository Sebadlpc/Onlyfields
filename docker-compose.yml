services:
  db-mysql:
    image: mysql:8.0
    container_name: onlyfields-db-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: onlyfields_usuarios
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - onlyfields-network
    restart: unless-stopped

  ms-usuarios:
    build:
      context: .
      dockerfile: usuarios/Dockerfile
    container_name: onlyfields-ms-usuarios
    ports:
      - "8081:8081"
    depends_on:
      - db-mysql
    networks:
      - onlyfields-network
    restart: unless-stopped

  ms-suscripciones:
    build:
      context: .
      dockerfile: suscripciones/Dockerfile
    container_name: onlyfields-ms-suscripciones
    ports:
      - "8084:8084"
    depends_on:
      - db-mysql
      - ms-usuarios
    networks:
      - onlyfields-network
    restart: unless-stopped

  ms-inventario:
    build:
      context: .
      dockerfile: inventario/Dockerfile
    container_name: onlyfields-ms-inventario
    ports:
      - "8085:8085"
    depends_on:
      - db-mysql
      - ms-usuarios
    networks:
      - onlyfields-network
    restart: unless-stopped

  ms-configuracion:
    build:
      context: .
      dockerfile: configuracion/Dockerfile
    container_name: onlyfields-ms-configuracion
    ports:
      - "8089:8089"
    depends_on:
      - db-mysql
      - ms-usuarios
    networks:
      - onlyfields-network
    restart: unless-stopped

networks:
  onlyfields-network:
    driver: bridge

volumes:
  mysql-data:
