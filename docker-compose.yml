services:

  db-mysql:
    image: mysql:8.0
    container_name: onlyfields-db-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: onlyfields_reservas
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - onlyfields-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ms-reservas:
    build:
      context: .
      dockerfile: reservas/Dockerfile
    container_name: onlyfields-ms-reservas
    ports:
      - "8082:8080"
    depends_on:
      db-mysql:
        condition: service_healthy
    networks:
      - onlyfields-network
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-mysql:3306/onlyfields_reservas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

networks:
  onlyfields-network:
    driver: bridge

volumes:
  mysql-data: