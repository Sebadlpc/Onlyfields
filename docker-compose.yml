services:
  db-mysql:
    image: mysql:8.0
    container_name: onlyfields-db-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: onlyfields_usuarios
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - onlyfields-network
    restart: unless-stopped

  ms-accesos:
    build:
      context: .
      dockerfile: usuarios/Dockerfile
    container_name: onlyfields-ms-accesos
    ports:
      - "8086:8080"
    depends_on:
      - db-mysql
    networks:
      - onlyfields-network
    restart: unless-stopped

  ms-pos:
    build:
      context: .
      dockerfile: usuarios/Dockerfile
    container_name: onlyfields-ms-pos
    ports:
      - "8083:8080"
    depends_on:
      - db-mysql
    networks:
      - onlyfields-network
    restart: unless-stopped

  ms-seguimiento:
    build:
      context: .
      dockerfile: usuarios/Dockerfile
    container_name: onlyfields-ms-seguimiento
    ports:
      - "8087:8080"
    depends_on:
      - db-mysql
    networks:
      - onlyfields-network
    restart: unless-stopped
networks:
  onlyfields-network:
    driver: bridge

volumes:
  mysql-data: