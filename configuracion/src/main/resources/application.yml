server:
  port: 8089

spring:
  application:
    name: ms-configuracion
  datasource:
    url: jdbc:mysql://db-mysql:3306/onlyfields_configuracion?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: true
    path: /api/v1/configuracion/v3/api-docs
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html
    operationsSorter: alpha # Personalización 1: Ordenar operaciones alfabéticamente
    tagsSorter: alpha       # Personalización 2: Ordenar tags alfabéticamente
